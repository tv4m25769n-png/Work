<meta name="robots" content="noindex, nofollow">
<style>
  #lock_screen {
    position: fixed; inset: 0; background: #111827; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif;
  }
  #lock_screen input {
    font-size: 24px; letter-spacing: 8px; text-align: center; width: 140px;
    padding: 8px; margin: 12px 0; border-radius: 6px; border: 1px solid #4b5563;
    background: #1f2937; color: #fff;
  }
  #lock_screen button {
    background: #10b981; color: #fff; border: none; padding: 10px 20px;
    font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
  }
</style>

<div id="lock_screen">
  <h3>Enter PIN to Unlock</h3>
  <input type="password" id="pin_input" maxlength="4" inputmode="numeric" placeholder="••••">
  <button onclick="checkPin()">Unlock</button>
  <div id="pin_err" style="color: #ef4444; font-size: 12px; margin-top: 8px;"></div>
</div>

<script>
  const MY_PIN = "1234"; // Set your 4-digit PIN here
  function checkPin() {
    if (document.getElementById('pin_input').value === MY_PIN) {
      document.getElementById('lock_screen').style.display = 'none';
      sessionStorage.setItem('unlocked', 'true');
    } else {
      document.getElementById('pin_err').textContent = "Incorrect PIN";
    }
  }
  if (sessionStorage.getItem('unlocked') === 'true') {
    document.getElementById('lock_screen').style.display = 'none';
  }
</script>
