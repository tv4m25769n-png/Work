<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Martin Law — Work Hub</title>
<style>
  @page { size: A4 portrait; margin: 0mm; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
    margin: 0;
    padding: 0;
    color: #000;
    overflow-x: auto;
  }

  #pin_screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f8fafc;
    padding: 20px;
  }
  .pin-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  .pin-card h2 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; }
  .pin-card p { margin: 0 0 18px 0; font-size: 12px; color: #94a3b8; }
  .pin-input {
    width: 160px;
    font-size: 26px;
    letter-spacing: 10px;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #fff;
    outline: none;
    margin-bottom: 14px;
  }
  .pin-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #10b981;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
  #pin_err { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; }

  #hub_view {
    display: none;
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
    color: #f8fafc;
  }
  .hub-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .hub-header h1 { margin: 0; font-size: 22px; color: #fff; }
  .hub-header span { font-size: 12px; color: #38bdf8; }
  .hub-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .hub-btn {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 18px 20px;
    color: #fff;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hub-btn:hover { background: #334155; }
  .hub-btn-title { font-size: 16px; font-weight: bold; color: #34d399; margin-bottom: 4px; }
  .hub-btn-desc { font-size: 12px; color: #94a3b8; }
  .hub-arrow { font-size: 20px; color: #64748b; font-weight: bold; }
  .hub-footer-actions {
    margin-top: 24px;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
  }
  .text-btn {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .text-btn:hover { color: #38bdf8; }

  /* Cloud Sync Modal */
  #sync_modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    z-index: 100000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .sync-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    color: #f8fafc;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .sync-card h3 { margin: 0 0 8px 0; font-size: 16px; color: #38bdf8; }
  .sync-card p { margin: 0 0 14px 0; font-size: 11.5px; color: #94a3b8; line-height: 1.4; }
  .sync-field { margin-bottom: 12px; }
  .sync-field label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; font-weight: bold; }
  .sync-field input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #fff;
    font-size: 12px;
    outline: none;
  }
  .sync-actions { display: flex; gap: 8px; margin-top: 16px; }
  .sync-actions button { flex: 1; padding: 9px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; color: #fff; }

  #timesheet_view {
    display: none;
    background: #e5e7eb;
    min-height: 100vh;
    padding: 8px;
  }
  .no-print {
    width: 760px;
    margin: 0 auto 10px auto;
    background: #111827;
    color: #f9fafb;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .dash-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #374151;
  }
  .dash-title { font-size: 13px; font-weight: bold; color: #34d399; display: flex; align-items: center; gap: 8px; }
  .sync-badge {
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 12px;
    background: #1f2937;
    border: 1px solid #374151;
    color: #9ca3af;
    cursor: pointer;
    font-weight: normal;
  }
  .btn-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    color: #fff;
  }
  .btn-green { background: #10b981; }
  .btn-blue { background: #3b82f6; }
  .btn-purple { background: #6366f1; }
  .btn-gray { background: #374151; border: 1px solid #4b5563; }

  .counter-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    text-align: center;
  }
  .counter-card {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 5px;
    padding: 5px 4px;
  }
  .counter-label { font-size: 9.5px; color: #9ca3af; text-transform: uppercase; }
  .counter-val { font-size: 14px; font-weight: bold; color: #fff; margin-top: 2px; }
  .counter-sub { font-size: 9px; color: #fbbf24; margin-top: 1px; }
  .rate-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #374151;
    border: 1px solid #4b5563;
    border-radius: 3px;
    padding: 1px 2px;
    margin-top: 2px;
    gap: 2px;
  }
  .rate-box span { font-size: 8.5px; color: #9ca3af; }
  .rate-input {
    width: 34px;
    background: transparent;
    border: none;
    color: #fbbf24;
    font-size: 9px;
    font-weight: bold;
    text-align: center;
    outline: none;
    padding: 0;
  }
  .rate-select {
    background: #111827;
    border: 1px solid #4b5563;
    color: #38bdf8;
    font-size: 8.5px;
    font-weight: bold;
    border-radius: 2px;
    outline: none;
    padding: 0;
  }

  #site_drawer {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #374151;
    font-size: 11px;
  }
  .site-add-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .site-add-row input {
    background: #374151;
    border: 1px solid #4b5563;
    color: #fff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 11px;
  }
  .site-tags { display: flex; flex-wrap: wrap; gap: 5px; max-height: 90px; overflow-y: auto; }
  .site-tag {
    background: #374151;
    padding: 3px 7px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
  }
  .site-tag button { background: none; border: none; color: #f87171; font-weight: bold; cursor: pointer; padding: 0; font-size: 12px; }

  #custom_ac {
    position: absolute;
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #475569;
    border-radius: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    max-height: 190px;
    overflow-y: auto;
    z-index: 999999;
    display: none;
    font-size: 11.5px;
  }
  .ac-item {
    padding: 7px 10px;
    cursor: pointer;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item:active { background: #3b82f6; color: #fff; }
  .ac-zone { color: #38bdf8; font-size: 10px; font-weight: bold; }

  .sheet {
    width: 760px;
    margin: 0 auto;
    background: #fff;
    padding: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: 1.5px solid #000;
  }
  td {
    border: 1px solid #000;
    padding: 0 3px;
    height: 17px;
    font-size: 9.5px;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
  }
  .title-cell { text-align: center; font-weight: bold; font-size: 11.5px; height: 20px; }
  .box-label { vertical-align: top; text-align: center; font-size: 9.5px; padding-top: 2px; }
  .b-left { font-weight: bold; text-align: left; padding-left: 3px; }
  .b-center { font-weight: bold; text-align: center; }
  .r-center { font-weight: normal; text-align: center; }
  .r-left { font-weight: normal; text-align: left; padding-left: 3px; }
  .small-notice { font-weight: bold; text-align: center; font-size: 8px; }

  input.cell-in {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: Arial, sans-serif;
    font-size: 9.5px;
    color: #000;
    text-align: center;
    padding: 0 1px;
    margin: 0;
  }
  input.cell-in.left { text-align: left; }
  input.cell-in.bold { font-weight: bold; }
  input.cell-in.header-box-input {
    height: 31px;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
    display: block;
    margin-top: 2px;
  }
  input.tick-cell { cursor: pointer; font-weight: bold; font-size: 11px; user-select: none; }

  .day-toggle { display: none; }
  .day-label {
    display: inline-block;
    font-weight: bold;
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 50%;
    border: 1.5px solid transparent;
  }
  .day-toggle:checked + .day-label { border-color: #000; }

  @media print {
    @page { size: A4 portrait; margin: 0mm; }
    body { background: #fff !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
    #pin_screen, #hub_view, #sync_modal, .no-print, #custom_ac { display: none !important; }
    #timesheet_view { display: block !important; background: #fff !important; padding: 0 !important; margin: 0 !important; min-height: 0 !important; }
    .sheet { width: 100% !important; max-width: 100% !important; padding: 6mm 7mm !important; margin: 0 !important; box-shadow: none !important; }
    input::placeholder { color: transparent !important; -webkit-text-fill-color: transparent !important; }
  }
</style>
</head>
<body>

<div id="pin_screen">
  <div class="pin-card">
    <h2>work.martinlaw.me</h2>
    <p>Enter your 4-digit PIN to access Work Hub</p>
    <input type="password" id="pin_box" class="pin-input" maxlength="4" inputmode="numeric" placeholder="••••" oninput="if(this.value.length===4) verifyPin()">
    <button class="pin-btn" onclick="verifyPin()">Unlock Hub</button>
    <div id="pin_err"></div>
  </div>
</div>

<div id="sync_modal">
  <div class="sync-card">
    <h3>☁️ Cross-Device Cloud Sync</h3>
    <p>Enter a GitHub Personal Access Token (with <b>gist</b> permission) to automatically sync your timesheet and saved sites across your iPhone and tablet.</p>
    <div class="sync-field">
      <label>GitHub Token (ghp_...)</label>
      <input type="password" id="cfg_token" placeholder="Paste your GitHub token here">
    </div>
    <div class="sync-field">
      <label>Cloud Gist ID (Leave blank on first device to auto-create)</label>
      <input type="text" id="cfg_gist" placeholder="Auto-generated on save">
    </div>
    <div class="sync-actions">
      <button class="btn-gray" onclick="closeSyncModal()">Cancel</button>
      <button class="btn-green" onclick="saveSyncConfig()">Save &amp; Sync Now</button>
    </div>
  </div>
</div>

<div id="hub_view">
  <div class="hub-header">
    <h1>Martin Law — Work Hub</h1>
    <span>work.martinlaw.me</span>
  </div>
  <div class="hub-grid">
    <button class="hub-btn" onclick="openTool('timesheet')">
      <div>
        <div class="hub-btn-title">Weekly Mileage &amp; Timesheet</div>
        <div class="hub-btn-desc">Nurture Pest Control A4 sheet with auto-totals &amp; PDF export</div>
      </div>
      <div class="hub-arrow">›</div>
    </button>
  </div>
  <div class="hub-footer-actions">
